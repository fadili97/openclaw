[build]
builder = "dockerfile"

[deploy]
startCommand = "node openclaw.mjs gateway --allow-unconfigured --port $PORT --bind 0.0.0.0"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"

[variables]
PORT = "8080"
NODE_ENV = "production"
OPENCLAW_PREFER_PNPM = "1"
OPENCLAW_STATE_DIR = "/data/.openclaw"
OPENCLAW_WORKSPACE_DIR = "/data/workspace"

# Browser automation (uncomment if you need Playwright/Puppeteer)
# OPENCLAW_INSTALL_BROWSER = "1"
